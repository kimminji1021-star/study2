# pnpm 설정 파일 (단일 패키지 프로젝트).
# pnpm 11부터 인증·레지스트리 외 설정은 .npmrc가 아니라 이 파일에서 읽는다.

# package.json engines.node 범위 밖의 Node.js로 설치하면 실패시킨다(REQ-INFRA-001).
# pnpm 11.28.9는 이 값이 없으면 경고만 출력하고 종료 코드 0으로 끝난다(M1에서 실측).
engineStrict: true

# 빌드 스크립트 실행 허용 목록: 명시하지 않은 패키지의 빌드는 설치를 실패시킨다.
# sharp는 이 SPEC의 범위(미디어 처리) 밖이므로 넣지 않는다.
allowBuilds:
  esbuild: true
